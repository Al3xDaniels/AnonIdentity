[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anon-identity"
version = "0.1.0"
description = "Educational anonymous identity provider prototype"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "cryptography>=45.0,<46.0",
    "dbus-next>=0.2.3,<1.0",
    "fastapi>=0.116,<1.0",
    "mnemonic>=0.21,<1.0",
    "pyjwt>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[project.scripts]
anon-wallet = "anon_identity.cli:main"
anon-wallet-bridge = "anon_identity.wallet_bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anon_identity"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
